services:
  # 1. PostgreSQL 데이터베이스 설정
  postgres:
    image: postgres:15-alpine
    container_name: routemaker-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: routemaker_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d routemaker_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
