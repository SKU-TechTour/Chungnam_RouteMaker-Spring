services:
  # 1. PostgreSQL 데이터베이스 설정
  postgres:
    image: postgres:15-alpine
    container_name: routemaker-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: routemaker_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d routemaker_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 2. Redis 캐시 서버 설정 (★새로 추가!)
  redis:
    image: redis:7-alpine
    container_name: routemaker-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
