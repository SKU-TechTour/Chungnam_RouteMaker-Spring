# Desktop/Chrome integration testing without Docker.
# Production and Cloudtype continue to use application.properties + PostgreSQL.
spring.datasource.url=jdbc:h2:mem:routemaker;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.show-sql=false
