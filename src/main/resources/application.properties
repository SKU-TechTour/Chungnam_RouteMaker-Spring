spring.application.name=routemaker_backend
server.port=${PORT:8080}

# 1. PostgreSQL 연결 설정
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/routemaker_db}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. JPA/Hibernate 설정- 테이블 자동생성
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# 3. Flyway 스키마/초기 데이터 버전 관리
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# 외부 API 키는 저장소에 커밋하지 않고 실행 환경에서만 주입합니다.
external-api.tour.base-url=${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
external-api.tour.service-key=${TOUR_API_SERVICE_KEY:}
external-api.pet.base-url=${PET_TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorPetTourService2}
external-api.with-tour.base-url=${WITH_TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorWithService2}
external-api.congestion.base-url=${CONGESTION_API_BASE_URL:https://apis.data.go.kr/B551011/TatsCnctrRateService}
external-api.audio.base-url=${AUDIO_GUIDE_API_BASE_URL:https://apis.data.go.kr/B551011/Odii}
external-api.weather.base-url=${WEATHER_API_BASE_URL:https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0}
external-api.weather.service-key=${WEATHER_API_SERVICE_KEY:}
# 공공데이터포털은 Cloudtype에서 간헐적으로 응답 지연이 발생할 수 있어
# 짧은 하드 타임아웃으로 정상 응답을 취소하지 않도록 분리해 둡니다.
external-api.request-timeout-seconds=${EXTERNAL_API_REQUEST_TIMEOUT_SECONDS:40}
external-api.block-timeout-seconds=${EXTERNAL_API_BLOCK_TIMEOUT_SECONDS:45}
external-api.kakao.local-base-url=${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
external-api.kakao.mobility-base-url=${KAKAO_MOBILITY_BASE_URL:https://apis-navi.kakaomobility.com}
external-api.kakao.rest-api-key=${KAKAO_REST_API_KEY:}

# Firebase Admin: 로컬에서는 서비스 계정 JSON 경로를 환경변수로 주입합니다.
firebase.project-id=${FIREBASE_PROJECT_ID:chungnam-routemaker}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
firebase.service-account-json-base64=${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:}

# Cloudtype health check. 상세 actuator 정보는 외부에 노출하지 않습니다.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
