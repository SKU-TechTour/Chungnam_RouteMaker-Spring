spring.application.name=routemaker_backend

# 1. PostgreSQL 연결 설정
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/routemaker_db}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. JPA/Hibernate 설정- 테이블 자동생성
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Flyway 스키마/초기 데이터 버전 관리
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# 외부 API 키는 저장소에 커밋하지 않고 실행 환경에서만 주입합니다.
external-api.tour.base-url=${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
external-api.tour.service-key=${TOUR_API_SERVICE_KEY:}
external-api.weather.base-url=${WEATHER_API_BASE_URL:https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0}
external-api.weather.service-key=${WEATHER_API_SERVICE_KEY:}
external-api.kakao.local-base-url=${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
external-api.kakao.mobility-base-url=${KAKAO_MOBILITY_BASE_URL:https://apis-navi.kakaomobility.com}
external-api.kakao.rest-api-key=${KAKAO_REST_API_KEY:}

# Firebase Admin: 로컬에서는 서비스 계정 JSON 경로를 환경변수로 주입합니다.
firebase.project-id=${FIREBASE_PROJECT_ID:chungnam-routemaker}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
