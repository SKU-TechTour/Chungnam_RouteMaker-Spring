spring.application.name=routemaker_backend

# 1. PostgreSQL 연결 설정
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/routemaker_db}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. Redis 캐시 서버 연결 설정
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}


# 3. JPA/Hibernate 설정- 테이블 자동생성
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 4. Flyway 스키마/초기 데이터 버전 관리
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
